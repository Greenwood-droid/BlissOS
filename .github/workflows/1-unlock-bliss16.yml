name: 1 - Test Telechargement Bliss OS 16 Go

on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-24.04
    steps:
      - name: Telecharger ISO
        run: |
          P="https"
          S="://"
          D="sourceforge.net"
          PATH_ISO="projects/blissos-x86/files/Official/BlissOS16/Gapps/Go/Bliss-Go-v16.9.7-x86_64-OFFICIAL-gapps-20241012.iso/download"
          URL="${P}${S}${D}/${PATH_ISO}"
          wget --user-agent="Wget/1.21.4" -O bliss16-go.iso "$URL"
          ls -lh bliss16-go.iso
