name: 1 - Publier ISO Bliss OS 16 Go

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-iso:
    runs-on: ubuntu-24.04
    steps:
      - name: Telecharger ISO depuis SourceForge
        run: |
          P="https"
          S="://"
          D="sourceforge.net"
          PATH_ISO="projects/blissos-x86/files/Official/BlissOS16/Gapps/Go/Bliss-Go-v16.9.7-x86_64-OFFICIAL-gapps-20241012.iso/download"
          URL="${P}${S}${D}/${PATH_ISO}"
          wget --user-agent="Wget/1.21.4" -O Bliss-Go-v16.9.7-x86_64-OFFICIAL-gapps-20241012.iso "$URL"
          ls -lh Bliss-Go-v16.9.7-x86_64-OFFICIAL-gapps-20241012.iso

      - name: Publier ISO sur GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v16.9.7-go-iso
          name: "Bliss OS 16.9.7 Go ISO Officielle"
          files: Bliss-Go-v16.9.7-x86_64-OFFICIAL-gapps-20241012.iso
