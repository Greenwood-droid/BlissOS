name: 1 - Test Telechargement Bliss OS 16 Go

on:
  workflow_dispatch:

jobs:
  test-download:
    runs-on: ubuntu-latest
    steps:
      - name: Telecharger ISO via navigateur headless
        run: |
          python3 - << 'PY'
          import urllib.request
          from playwright.sync_api import sync_playwright

          url = "https://sourceforge.net/projects/blissos-x86/files/Official/BlissOS16/Gapps/Go/Bliss-Go-v16.9.7-x86_64-OFFICIAL-gapps-20241012.iso/download"
          with sync_playwright() as p:
              browser = p.chromium.launch()
              page = browser.new_page()
              with page.expect_download(timeout=300000) as download_info:
                  page.goto(url)
              download = download_info.value
              download.save_as("bliss16-go.iso")
              browser.close()
          PY
          ls -lh bliss16-go.iso
